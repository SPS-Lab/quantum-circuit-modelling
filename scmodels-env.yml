name: scmodels-env

channels:
  - conda-forge

dependencies:
  # Core Python
  - python=3.11

  # Numerical stack
  - numpy
  - scipy
  - threadpoolctl
  - cuda-version=12.9
  - cupy
  - dask
  - distributed
  - bokeh

  # Quantum toolkits (model + simulation layers)
  - qutip
  - scqubits

  # Jupyter kernel support
  - ipykernel

  # Utilities
  - matplotlib
  - sympy

  # Python type checker, linter and formatter
  - pyright
  - pylint
  - black

  # For storing data
  - h5py

  # To run tests
  - pytest

  # Profiling
  - snakeviz
